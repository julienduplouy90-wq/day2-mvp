<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 — Ne lâche plus au jour 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #f6f4ff;
    --bg-b: #fef9f4;
    --surface: #ffffff;
    --surface-alt: #f8f7fc;
    --border: #eae7f5;
    --text: #211c3d;
    --text-dim: #6f6b87;
    --text-faint: #a5a1b8;
    --primary: #6d5efc;
    --primary-dark: #5847e8;
    --primary-soft: #efeaff;
    --amber: #f59e0b;
    --amber-soft: #fff3dd;
    --red: #ef4a5f;
    --red-soft: #ffe7ea;
    --green: #16b579;
    --green-soft: #e3f9ee;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow-card: 0 12px 32px -16px rgba(80, 60, 160, 0.18);
    --shadow-btn: 0 8px 22px -8px rgba(109, 94, 252, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse 900px 500px at 15% -5%, var(--bg-a) 0%, transparent 55%),
                radial-gradient(ellipse 900px 500px at 100% 0%, var(--bg-b) 0%, transparent 55%),
                #fbfaff;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 16px 30px;
  }
  h1, h2, h3, h4 { font-family: 'Sora', 'Inter', sans-serif; margin: 0; }
  .app { width: 100%; max-width: 480px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px; color: white;
    box-shadow: var(--shadow-btn); flex-shrink: 0;
  }
  .brand-name { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .brand-name span { color: var(--primary); }
  .tagline { text-align: center; color: var(--text-faint); font-size: 13px; margin-bottom: 26px; }
  .step-track { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .step-track .label { font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; }
  .step-dots { display: flex; gap: 5px; }
  .step-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.2s; }
  .step-dots span.active { background: var(--primary); width: 18px; border-radius: 100px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-card);
    animation: pop 0.28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  h1.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; }
  h2.subtitle { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.1px; }
  p.lead { color: var(--text-dim); font-size: 14px; line-height: 1.5; margin: 0 0 4px; }
  .field { margin-top: 18px; }
  .field-label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: 0.1px; }
  .field-hint { display: block; font-size: 11px; color: var(--text-faint); margin-top: -4px; margin-bottom: 8px; }
  input[type=text] {
    width: 100%; background: var(--surface-alt); border: 1.5px solid var(--border);
    border-radius: var(--radius-md); padding: 13px 15px; color: var(--text);
    font-size: 15px; font-family: inherit; transition: border-color .15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--primary); background: white; }
  input::placeholder { color: var(--text-faint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; text-align: center; background: var(--primary); color: white;
    border: none; border-radius: var(--radius-md); padding: 15px 18px;
    font-size: 14.5px; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: 0.1px;
    cursor: pointer; margin-top: 22px; transition: transform 0.12s, box-shadow 0.15s, opacity .15s;
    box-shadow: var(--shadow-btn);
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn.secondary { background: var(--surface-alt); color: var(--text); box-shadow: none; border: 1.5px solid var(--border); }
  .btn.secondary:hover { border-color: var(--primary); }
  .btn.amber { background: var(--amber); box-shadow: 0 8px 22px -8px rgba(245, 158, 11, 0.5); }
  .btn.red { background: var(--red); box-shadow: 0 8px 22px -8px rgba(239, 74, 95, 0.5); }
  .btn.green { background: var(--green); box-shadow: 0 8px 22px -8px rgba(22, 181, 121, 0.5); }
  .btn.ghost {
    background: none; box-shadow: none; color: var(--text-faint); text-decoration: underline;
    width: auto; padding: 6px 0; font-size: 13px; font-weight: 500; margin-top: 8px;
  }
  .btn.ghost:hover { color: var(--text-dim); transform: none; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    --chip-bg: var(--surface-alt); --chip-fg: var(--text);
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 15px; border-radius: 100px; border: 1.5px solid var(--border);
    background: var(--surface-alt); color: var(--text);
    font-size: 13.5px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--primary); transform: translateY(-1px); }
  .chip.selected { background: var(--chip-bg); border-color: var(--chip-fg); color: var(--chip-fg); box-shadow: 0 3px 10px -4px rgba(0,0,0,0.12); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .choice-cards { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .choice-card {
    display: block; text-align: left; width: 100%;
    padding: 15px 17px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
    border-left: 3px solid var(--border);
    background: var(--surface-alt); cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .choice-card:hover { border-color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }
  .choice-card.accent-neutral { border-left-color: var(--text-faint); }
  .choice-card.accent-warn { border-left-color: var(--amber); }
  .choice-card h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
  .choice-card p { margin: 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--primary-soft);
    border: 1px solid #6d5efc35; color: var(--primary-dark); font-size: 12px; font-weight: 700;
    padding: 5px 13px; border-radius: 100px; margin-bottom: 14px;
  }
  .progress-wrap { margin: 16px 0 4px; }
  .progress-bar { height: 9px; background: var(--surface-alt); border-radius: 100px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #a78bfa); border-radius: 100px; transition: width 0.4s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-faint); margin-top: 7px; font-weight: 600; }
  .why-box {
    background: var(--surface-alt); border-left: 3px solid var(--primary);
    padding: 13px 15px; border-radius: 0 var(--radius-md) var(--radius-md) 0;
    font-size: 13.5px; color: var(--text-dim); margin-top: 16px; line-height: 1.5;
  }
  .journal-item {
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 13px 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .journal-item .info { min-width: 0; }
  .journal-item .name { font-weight: 700; font-size: 14px; }
  .journal-item .meta-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; }
  .tag.outcome-completed { background: var(--green-soft); color: #0f9463; }
  .days-held { font-size: 11px; color: var(--text-faint); font-weight: 600; }
  .remove-x { cursor: pointer; color: var(--text-faint); font-size: 15px; flex-shrink: 0; padding: 4px; }
  .remove-x:hover { color: var(--red); }
  .insight-box {
    background: var(--amber-soft); border: 1px solid #f59e0b35; border-radius: var(--radius-md);
    padding: 14px 16px; font-size: 13.5px; margin-top: 16px; line-height: 1.5; color: #92620a;
  }
  .insight-box b { color: #7a4e07; }
  .pattern-grid { display: flex; gap: 12px; margin-top: 4px; }
  .pattern-stat { flex: 1; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; text-align: center; }
  .pattern-stat .num { font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 800; color: var(--primary); }
  .pattern-stat .lbl { font-size: 11px; color: var(--text-faint); margin-top: 3px; font-weight: 600; line-height: 1.3; }
  .footer-link { text-align: center; display: block; color: var(--text-faint); font-size: 12px; margin-top: 18px; text-decoration: none; }
  .footer-link:hover { color: var(--text-dim); }
  .value-list { list-style: none; padding: 0; margin: 18px 0; display: flex; flex-direction: column; gap: 12px; }
  .value-list li { display: flex; gap: 12px; align-items: center; font-size: 13.5px; color: var(--text); font-weight: 600; }
  .num-badge {
    width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800;
    flex-shrink: 0; font-family: 'Sora', sans-serif;
  }
  .badge-mvp {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    padding: 4px 11px; border-radius: 100px; background: var(--surface-alt); color: var(--text-dim);
    border: 1px solid var(--border); margin-bottom: 14px; text-transform: uppercase;
  }
  .personal-note {
    background: var(--primary-soft); border: 1px solid #6d5efc30; border-radius: var(--radius-md);
    padding: 13px 15px; font-size: 13px; color: var(--primary-dark); line-height: 1.5; margin: 16px 0 4px;
  }
  .completion-banner { background: var(--green-soft); border: 1px solid #16b57945; border-radius: var(--radius-md); padding: 20px; margin-top: 14px; text-align: center; }
  .completion-banner .check-badge { width: 36px; height: 36px; border-radius: 50%; background: var(--green); color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .completion-banner h3 { font-size: 15.5px; color: #0f9463; margin-bottom: 4px; }
  .completion-banner p { margin: 0; font-size: 12.5px; color: var(--text-dim); }
  .global-footer { color: var(--text-faint); font-size: 11px; text-align: center; margin-top: 20px; }
  .icon-inline { width: 12px; height: 12px; vertical-align: -1.5px; }
  .next-badge { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="brand-mark">D2</div><div class="brand-name">Day<span>2</span></div></div>
  <div class="tagline">Le jour où la motivation retombe — et où tu tiens quand même.</div>
  <div id="root"></div>
</div>
<div class="global-footer">Day 2 · MVP v0.4</div>

<script>
const STORAGE_KEY = "day2_state_v4";
const CHECK_SVG = `<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const CHECK_SVG_LG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="20 6 9 17 4 12"/></svg>`;
const ARROW_SVG_LG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  return {
    seenLanding: false, onboarded: false, onboardingStep: null,
    pastAbandons: [], currentEngagement: null, history: [],
    pivotDraft: null, addingPast: false
  };
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); render(); }
let state = loadState();

const REASONS = [
  { key: "resultats", label: "Pas de résultats", bg: "#e8f1ff", fg: "#2563eb" },
  { key: "commercial", label: "Trop dur à vendre", bg: "#fff1e6", fg: "#ea580c" },
  { key: "lassitude", label: "Lassitude", bg: "#f3e8ff", fg: "#9333ea" },
  { key: "doute", label: "Doute / sens", bg: "#e6fbf7", fg: "#0d9488" },
  { key: "externe", label: "Avis extérieur", bg: "#ffe8f3", fg: "#db2777" },
  { key: "autre", label: "Autre", bg: "#f1f0f4", fg: "#64748b" }
];
const DURATION_BUCKETS = [
  { value: "unknown", label: "Je sais plus", days: null },
  { value: "lt1w", label: "< 1 semaine", days: 5 },
  { value: "1to4w", label: "1-4 semaines", days: 15 },
  { value: "1to3m", label: "1-3 mois", days: 60 },
  { value: "3to6m", label: "3-6 mois", days: 135 },
  { value: "gt6m", label: "6 mois +", days: 200 }
];
const ENGAGEMENT_DURATIONS = [
  { value: 30, label: "1 mois" }, { value: 60, label: "2 mois" },
  { value: 90, label: "3 mois" }, { value: 180, label: "6 mois" }
];
const MOTIVATIONS = [
  { value: "argent", label: "Argent" }, { value: "sens", label: "Sens" },
  { value: "impact", label: "Impact" }, { value: "reconnaissance", label: "Reconnaissance" },
  { value: "liberte", label: "Liberté" }, { value: "passion", label: "Passion" }
];

function reasonMeta(key) { return REASONS.find(r => r.key === key) || REASONS[REASONS.length - 1]; }
function bucketMeta(value) { return DURATION_BUCKETS.find(b => b.value === value); }
function daysBetween(a, b) { return Math.floor((b - a) / (1000 * 60 * 60 * 24)); }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

function stepTrack(label, current, total) {
  let dots = '';
  for (let i = 0; i < total; i++) dots += `<span class="${i === current - 1 ? 'active' : ''}"></span>`;
  return `<div class="step-track"><span class="label">${label}</span><div class="step-dots">${dots}</div></div>`;
}
function tagsHTML(reasonKeys) {
  return (reasonKeys || []).map(k => {
    const m = reasonMeta(k);
    return `<span class="tag" style="background:${m.bg};color:${m.fg}"><span class="dot" style="background:${m.fg}"></span>${m.label}</span>`;
  }).join('');
}

// Single-choice chip group.
function buildSingleChoice(items, initial, colored) {
  let value = initial;
  const container = el(`<div class="chip-group"></div>`);
  function paint() {
    container.innerHTML = '';
    items.forEach(it => {
      const key = it.key || it.value;
      const dot = (colored && it.fg) ? `<span class="dot" style="background:${it.fg}"></span>` : '';
      const chip = el(`<button type="button" class="chip ${key === value ? 'selected' : ''}">${dot}<span>${it.label}</span></button>`);
      if (colored && it.bg) { chip.style.setProperty('--chip-bg', it.bg); chip.style.setProperty('--chip-fg', it.fg); }
      chip.onclick = () => { value = key; paint(); };
      container.appendChild(chip);
    });
  }
  paint();
  return { container, get: () => value };
}
// Multi-choice chip group (checkboxes). onChange(currentArray) fires after every toggle.
function buildMultiChoice(items, initial, colored, onChange) {
  const set = new Set(initial || []);
  const container = el(`<div class="chip-group"></div>`);
  function paint() {
    container.innerHTML = '';
    items.forEach(it => {
      const key = it.key || it.value;
      const isSel = set.has(key);
      const dot = colored && it.fg ? `<span class="dot" style="background:${it.fg}"></span>` : (isSel ? CHECK_SVG : '');
      const chip = el(`<button type="button" class="chip ${isSel ? 'selected' : ''}">${dot}<span>${it.label}</span></button>`);
      if (colored && it.bg) { chip.style.setProperty('--chip-bg', it.bg); chip.style.setProperty('--chip-fg', it.fg); }
      chip.onclick = () => { isSel ? set.delete(key) : set.add(key); paint(); if (onChange) onChange(Array.from(set)); };
      container.appendChild(chip);
    });
  }
  paint();
  return { container, get: () => Array.from(set) };
}

function formatHeld(record) {
  if (record.daysHeldBucket) {
    const b = bucketMeta(record.daysHeldBucket);
    return b && b.value !== 'unknown' ? b.label : null;
  }
  if (typeof record.daysHeldEstimate === 'number') return record.daysHeldEstimate + 'j';
  return null;
}
function getAllAbandonRecords() {
  return [...state.pastAbandons, ...(state.history || []).filter(h => h.outcome === 'abandoned')];
}
function computePatternInsight() {
  const records = getAllAbandonRecords();
  if (records.length === 0) return null;
  const counts = {};
  records.forEach(r => (r.reasonCategories || []).forEach(k => counts[k] = (counts[k] || 0) + 1));
  let topReason = null, topCount = 0;
  Object.entries(counts).forEach(([k, v]) => { if (v > topCount) { topCount = v; topReason = k; } });
  const withDays = records.filter(r => typeof r.daysHeldEstimate === 'number');
  const avgDays = withDays.length ? Math.round(withDays.reduce((s, r) => s + r.daysHeldEstimate, 0) / withDays.length) : null;
  return { total: records.length, topReason, topCount, avgDays };
}

// ---------- LANDING ----------
function renderLanding() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const card = el(`
    <div class="card">
      <span class="badge-mvp">MVP · Test en cours</span>
      <h1 class="title">Ne lâche plus au jour 2.</h1>
      <p class="lead">Reste sur une idée, plus longtemps que d'habitude.</p>
      <ul class="value-list">
        <li><span class="num-badge">1</span>Ton historique d'abandons</li>
        <li><span class="num-badge">2</span>Un engagement clair et daté</li>
        <li><span class="num-badge">3</span>Une pause avant de tout lâcher</li>
      </ul>
      <div class="personal-note">Je vis ce pattern moi-même. Cet outil, c'est celui que j'aurais aimé avoir.</div>
      <button class="btn" id="start-btn">Commencer</button>
    </div>
  `);
  root.appendChild(card);
  card.querySelector('#start-btn').onclick = () => { state.seenLanding = true; saveState(state); };
}

// ---------- ONBOARDING STEP 1 : journal ----------
function renderOnboardingJournal() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const abandons = state.pastAbandons;
  const card = el(`
    <div class="card">
      ${stepTrack('Étape 1 / 2', 1, 2)}
      <h1 class="title">Tes abandons passés</h1>
      <p class="lead">2-3 projets lâchés, la vraie raison à chaque fois.</p>
      <div id="abandon-list" style="margin-top:14px"></div>
      <div class="field">
        <span class="field-label">Nom du projet</span>
        <input type="text" id="ab-name" placeholder="Ex: SaaS paysagiste">
      </div>
      <div class="field">
        <span class="field-label">Pourquoi tu as arrêté ?</span>
        <span class="field-hint">Plusieurs choix possibles</span>
        <div id="ab-reason-slot"></div>
      </div>
      <div class="field"><span class="field-label">Combien de temps tenu ?</span><div id="ab-duration-slot"></div></div>
      <button class="btn secondary" id="add-abandon">+ Ajouter à la liste</button>
      <button class="btn" id="continue-onboarding" ${abandons.length === 0 ? 'disabled' : ''}>
        Continuer ${abandons.length > 0 ? '(' + abandons.length + ')' : ''}
      </button>
      ${abandons.length === 0 ? '<button class="btn ghost" id="skip-onboarding">Passer cette étape</button>' : ''}
    </div>
  `);
  root.appendChild(card);

  const reasonChoice = buildMultiChoice(REASONS, [], true);
  card.querySelector('#ab-reason-slot').appendChild(reasonChoice.container);
  const durationChoice = buildSingleChoice(DURATION_BUCKETS, 'unknown', false);
  card.querySelector('#ab-duration-slot').appendChild(durationChoice.container);

  const list = card.querySelector('#abandon-list');
  abandons.forEach(a => {
    const held = formatHeld(a);
    list.appendChild(el(`
      <div class="journal-item">
        <div class="info">
          <div class="name">${a.name}</div>
          <div class="meta-row">${tagsHTML(a.reasonCategories)}${held ? `<span class="days-held">${held}</span>` : ''}</div>
        </div>
        <span class="remove-x" data-id="${a.id}">&times;</span>
      </div>
    `));
  });
  list.querySelectorAll('.remove-x').forEach(x => {
    x.onclick = () => { state.pastAbandons = state.pastAbandons.filter(a => a.id !== x.dataset.id); saveState(state); };
  });

  card.querySelector('#add-abandon').onclick = () => {
    const name = card.querySelector('#ab-name').value.trim();
    if (!name) { alert("Donne un nom au projet."); return; }
    const reasons = reasonChoice.get();
    if (reasons.length === 0) { alert("Choisis au moins une raison."); return; }
    const bucket = durationChoice.get();
    const bm = bucketMeta(bucket);
    state.pastAbandons.push({
      id: crypto.randomUUID(), name,
      reasonCategories: reasons,
      daysHeldBucket: bucket,
      daysHeldEstimate: bm ? bm.days : null,
      date: new Date().toISOString()
    });
    saveState(state);
  };
  const goNext = () => { state.onboardingStep = 2; saveState(state); };
  card.querySelector('#continue-onboarding').onclick = () => { if (abandons.length > 0) goNext(); };
  const skipBtn = card.querySelector('#skip-onboarding');
  if (skipBtn) skipBtn.onclick = goNext;
}

// ---------- ONBOARDING STEP 2 : engagement ----------
function renderOnboardingEngagement() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const isFirstTime = !state.onboarded;
  const card = el(`
    <div class="card">
      ${isFirstTime ? stepTrack('Étape 2 / 2', 2, 2) : ''}
      <h1 class="title">${isFirstTime ? 'Ton engagement' : 'Nouvel engagement'}</h1>
      <p class="lead">Une idée. Un cap. Une durée.</p>
      <div class="field"><span class="field-label">Ton idée</span><input type="text" id="eng-name" placeholder="Ex: Day 2"></div>
      <div class="field"><span class="field-label">Ce qui te motive</span><div id="eng-motiv-slot"></div></div>
      <div class="field"><span class="field-label">En une phrase, pourquoi ? (optionnel)</span><input type="text" id="eng-why" placeholder="Ex: Aider les solopreneurs à tenir"></div>
      <div class="field"><span class="field-label">Pendant combien de temps ?</span><div id="eng-duration-slot"></div></div>
      <button class="btn" id="lock-engagement">Verrouiller mon engagement</button>
    </div>
  `);
  root.appendChild(card);
  const motivChoice = buildMultiChoice(MOTIVATIONS, [], false);
  card.querySelector('#eng-motiv-slot').appendChild(motivChoice.container);
  const durationChoice = buildSingleChoice(ENGAGEMENT_DURATIONS, 90, false);
  card.querySelector('#eng-duration-slot').appendChild(durationChoice.container);

  card.querySelector('#lock-engagement').onclick = () => {
    const name = card.querySelector('#eng-name').value.trim();
    const motivations = motivChoice.get();
    if (!name) { alert("Donne un nom à ton idée."); return; }
    if (motivations.length === 0) { alert("Choisis au moins une motivation — ça te servira plus tard."); return; }
    state.currentEngagement = {
      name, motivations,
      whyShort: card.querySelector('#eng-why').value.trim(),
      durationDays: durationChoice.get(),
      startDate: new Date().toISOString()
    };
    state.onboarded = true;
    state.onboardingStep = null;
    saveState(state);
  };
}

// ---------- DASHBOARD ----------
function renderDashboard() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const eng = state.currentEngagement;
  const start = new Date(eng.startDate);
  const today = new Date();
  const dayNum = Math.max(1, daysBetween(start, today) + 1);
  const pct = Math.min(100, Math.round((dayNum / eng.durationDays) * 100));
  const remaining = Math.max(0, eng.durationDays - dayNum);
  const isComplete = dayNum >= eng.durationDays;
  const motivLabels = (eng.motivations || []).map(m => (MOTIVATIONS.find(x => x.value === m) || {}).label).filter(Boolean).join(' · ');
  const whyLine = [motivLabels, eng.whyShort].filter(Boolean).join(' — ');

  const card = el(`
    <div class="card">
      <span class="pill">Jour ${dayNum} / ${eng.durationDays}</span>
      <h1 class="title">${eng.name}</h1>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>${pct}%</span><span>${remaining}j restants</span></div>
      </div>
      ${whyLine ? `<div class="why-box">${whyLine}</div>` : ''}
      ${isComplete ? `
        <div class="completion-banner">
          <div class="check-badge">${CHECK_SVG_LG}</div>
          <h3>Engagement tenu</h3>
          <p>${eng.durationDays} jours sur "${eng.name}". À toi la suite.</p>
        </div>
        <button class="btn green" id="extend-engagement">Prolonger de ${eng.durationDays}j</button>
        <button class="btn secondary" id="new-after-complete">Nouveau projet</button>
      ` : `<button class="btn amber" id="want-pivot">Envie de tout changer ?</button>`}
    </div>
  `);
  root.appendChild(card);

  const wantPivot = card.querySelector('#want-pivot');
  if (wantPivot) wantPivot.onclick = () => { state.pivotDraft = { step: 1 }; saveState(state); };
  const extendBtn = card.querySelector('#extend-engagement');
  if (extendBtn) extendBtn.onclick = () => {
    state.history.push({ id: crypto.randomUUID(), name: eng.name, outcome: 'completed', daysHeldEstimate: eng.durationDays, date: new Date().toISOString() });
    state.currentEngagement.startDate = new Date().toISOString();
    saveState(state);
  };
  const newAfterBtn = card.querySelector('#new-after-complete');
  if (newAfterBtn) newAfterBtn.onclick = () => {
    state.history.push({ id: crypto.randomUUID(), name: eng.name, outcome: 'completed', daysHeldEstimate: eng.durationDays, date: new Date().toISOString() });
    state.currentEngagement = null;
    saveState(state);
  };

  const insight = computePatternInsight();
  if (insight) {
    const rm = reasonMeta(insight.topReason);
    const patternCard = el(`
      <div class="card">
        <h2 class="subtitle">Ton pattern</h2>
        <div class="pattern-grid">
          <div class="pattern-stat"><div class="num">${insight.total}</div><div class="lbl">abandon${insight.total > 1 ? 's' : ''}</div></div>
          <div class="pattern-stat"><div class="num">${insight.avgDays !== null ? insight.avgDays + 'j' : '—'}</div><div class="lbl">tenu en moyenne</div></div>
        </div>
        <p class="lead" style="margin-top:12px">Raison n°1 : <b style="color:var(--text)">${rm.label}</b> (${insight.topCount}×)</p>
      </div>
    `);
    root.appendChild(patternCard);
  }

  const journalCard = el(`
    <div class="card">
      <h2 class="subtitle">Ton journal (${state.pastAbandons.length + (state.history || []).length})</h2>
      <div id="journal-list" style="margin-top:12px"></div>
      <button class="btn ghost" id="add-past">+ Ajouter un abandon passé</button>
    </div>
  `);
  root.appendChild(journalCard);
  const jlist = journalCard.querySelector('#journal-list');
  const combined = [...state.pastAbandons.map(a => ({ ...a, outcome: 'abandoned' })), ...(state.history || [])]
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  if (combined.length === 0) jlist.appendChild(el(`<p class="lead" style="margin:0">Rien pour l'instant.</p>`));
  combined.forEach(a => {
    const held = formatHeld(a);
    jlist.appendChild(el(`
      <div class="journal-item">
        <div class="info">
          <div class="name">${a.name}</div>
          <div class="meta-row">
            ${a.outcome === 'completed' ? `<span class="tag outcome-completed">${CHECK_SVG} Réussi</span>` : tagsHTML(a.reasonCategories)}
            ${held ? `<span class="days-held">${held}</span>` : ''}
          </div>
        </div>
      </div>
    `));
  });
  journalCard.querySelector('#add-past').onclick = () => { state.addingPast = true; saveState(state); };

  root.appendChild(el(`<a class="footer-link" href="#" id="reset-link">réinitialiser (démo/test)</a>`));
  document.getElementById('reset-link').onclick = (e) => {
    e.preventDefault();
    if (confirm("Tout effacer ?")) { localStorage.removeItem(STORAGE_KEY); state = loadState(); render(); }
  };
}

function renderAddPastFromDashboard() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const card = el(`
    <div class="card">
      <h2 class="subtitle">Ajouter un abandon</h2>
      <div class="field"><span class="field-label">Nom du projet</span><input type="text" id="ab-name"></div>
      <div class="field">
        <span class="field-label">Pourquoi tu as arrêté ?</span>
        <span class="field-hint">Plusieurs choix possibles</span>
        <div id="ab-reason-slot"></div>
      </div>
      <div class="field"><span class="field-label">Combien de temps tenu ?</span><div id="ab-duration-slot"></div></div>
      <button class="btn" id="save-ab">Enregistrer</button>
      <button class="btn secondary" id="cancel-ab">Annuler</button>
    </div>
  `);
  root.appendChild(card);
  const reasonChoice = buildMultiChoice(REASONS, [], true);
  card.querySelector('#ab-reason-slot').appendChild(reasonChoice.container);
  const durationChoice = buildSingleChoice(DURATION_BUCKETS, 'unknown', false);
  card.querySelector('#ab-duration-slot').appendChild(durationChoice.container);

  card.querySelector('#save-ab').onclick = () => {
    const name = card.querySelector('#ab-name').value.trim();
    if (!name) return;
    const reasons = reasonChoice.get();
    if (reasons.length === 0) { alert("Choisis au moins une raison."); return; }
    const bucket = durationChoice.get();
    const bm = bucketMeta(bucket);
    state.pastAbandons.push({
      id: crypto.randomUUID(), name,
      reasonCategories: reasons,
      daysHeldBucket: bucket,
      daysHeldEstimate: bm ? bm.days : null,
      date: new Date().toISOString()
    });
    state.addingPast = false;
    saveState(state);
  };
  card.querySelector('#cancel-ab').onclick = () => { state.addingPast = false; saveState(state); };
}

// ---------- ANTI-PIVOT FLOW ----------
function renderPivotFlow() {
  const root = document.getElementById('root'); root.innerHTML = '';
  const step = state.pivotDraft.step;

  if (step === 1) {
    const card = el(`
      <div class="card">
        ${stepTrack('Étape 1 / 4', 1, 4)}
        <h1 class="title">Ok, respire.</h1>
        <p class="lead">Qu'est-ce qui se passe, concrètement ? Plusieurs choix possibles.</p>
        <div id="reason-slot" style="margin-top:10px"></div>
        <button class="btn" id="reason-continue" disabled>Continuer</button>
      </div>
    `);
    root.appendChild(card);
    const continueBtn = card.querySelector('#reason-continue');
    const choice = buildMultiChoice(REASONS, [], true, (vals) => { continueBtn.disabled = vals.length === 0; });
    card.querySelector('#reason-slot').appendChild(choice.container);
    continueBtn.onclick = () => {
      const reasons = choice.get();
      if (reasons.length === 0) return;
      state.pivotDraft.reasons = reasons;
      state.pivotDraft.step = 2;
      saveState(state);
    };
    return;
  }

  if (step === 2) {
    const currentReasons = state.pivotDraft.reasons || [];
    const records = getAllAbandonRecords();
    const matching = records.filter(r => (r.reasonCategories || []).some(rc => currentReasons.includes(rc)));
    const totalAbandons = records.length;
    const insightData = computePatternInsight();
    const eng = state.currentEngagement;
    const currentDayNum = eng ? Math.max(1, daysBetween(new Date(eng.startDate), new Date()) + 1) : null;
    const reasonLabels = currentReasons.map(k => reasonMeta(k).label).join(', ');

    let insight = '';
    if (matching.length > 0) insight = `Déjà ${matching.length} fois pour "${reasonLabels}". Ça ressemble à un pattern.`;
    else if (totalAbandons > 0) insight = `Déjà ${totalAbandons} abandon${totalAbandons > 1 ? 's' : ''} avant celui-ci, raisons différentes cette fois.`;
    else insight = `Ce serait ton premier abandon noté. Prends 2 min avant de trancher.`;
    if (insightData && insightData.avgDays !== null && currentDayNum !== null) {
      insight += ` Tu es à <b>${currentDayNum}j</b> ici, ta moyenne passée est <b>${insightData.avgDays}j</b>.`;
    }

    const card = el(`
      <div class="card">
        ${stepTrack('Étape 2 / 4', 2, 4)}
        <h2 class="subtitle">Ton miroir</h2>
        <div id="mirror-list" style="margin-top:10px"></div>
        <div class="insight-box">${insight}</div>
        <button class="btn" id="mirror-continue">Continuer</button>
      </div>
    `);
    root.appendChild(card);
    const mlist = card.querySelector('#mirror-list');
    if (records.length === 0) mlist.appendChild(el(`<p class="lead" style="margin:0 0 4px">Ton journal est vide.</p>`));
    records.forEach(a => {
      const held = formatHeld(a);
      mlist.appendChild(el(`
        <div class="journal-item">
          <div class="info">
            <div class="name">${a.name}</div>
            <div class="meta-row">${tagsHTML(a.reasonCategories)}${held ? `<span class="days-held">${held}</span>` : ''}</div>
          </div>
        </div>
      `));
    });
    card.querySelector('#mirror-continue').onclick = () => { state.pivotDraft.step = 3; saveState(state); };
    return;
  }

  if (step === 3) {
    const card = el(`
      <div class="card">
        ${stepTrack('Étape 3 / 4', 3, 4)}
        <h1 class="title">Vrai signal, ou fuite ?</h1>
        <div class="choice-cards">
          <button type="button" class="choice-card accent-neutral" id="is-leak">
            <h4>C'est une fuite</h4>
            <p>Baisse de motivation, pas encore de preuve. Je continue.</p>
          </button>
          <button type="button" class="choice-card accent-warn" id="is-signal">
            <h4>C'est un vrai signal</h4>
            <p>Preuve concrète que ça ne marche pas. J'arrête.</p>
          </button>
        </div>
      </div>
    `);
    root.appendChild(card);
    card.querySelector('#is-leak').onclick = () => { state.pivotDraft = null; saveState(state); };
    card.querySelector('#is-signal').onclick = () => { state.pivotDraft.step = 4; saveState(state); };
    return;
  }

  if (step === 4) {
    const eng = state.currentEngagement;
    const daysHeld = Math.max(1, daysBetween(new Date(eng.startDate), new Date()) + 1);
    const card = el(`
      <div class="card">
        ${stepTrack('Étape 4 / 4', 4, 4)}
        <h2 class="subtitle">On documente</h2>
        <p class="lead">Tu auras tenu <b style="color:var(--text)">${daysHeld} jours</b> sur "${eng.name}".</p>
        <div class="field"><span class="field-label">Tu y retournerais un jour ?</span><div id="retry-slot"></div></div>
        <button class="btn red" id="confirm-abandon">Confirmer l'abandon</button>
        <button class="btn ghost" id="cancel-pivot">Annuler, je reste dessus</button>
      </div>
    `);
    root.appendChild(card);
    const retryChoice = buildSingleChoice([{ value: 'yes', label: 'Peut-être un jour' }, { value: 'no', label: 'Non, terminé' }], null, false);
    card.querySelector('#retry-slot').appendChild(retryChoice.container);
    card.querySelector('#confirm-abandon').onclick = () => {
      state.history.push({
        id: crypto.randomUUID(), name: eng.name, outcome: 'abandoned',
        reasonCategories: state.pivotDraft.reasons, daysHeldEstimate: daysHeld,
        wouldRetry: retryChoice.get(), date: new Date().toISOString()
      });
      state.currentEngagement = null;
      state.pivotDraft.step = 5;
      saveState(state);
    };
    card.querySelector('#cancel-pivot').onclick = () => { state.pivotDraft = null; saveState(state); };
    return;
  }

  if (step === 5) {
    const insight = computePatternInsight();
    const rm = insight ? reasonMeta(insight.topReason) : null;
    const card = el(`
      <div class="card">
        <div class="next-badge">${ARROW_SVG_LG}</div>
        <h1 class="title">Direction le prochain.</h1>
        <p class="lead">C'est noté dans ton journal — même un abandon appris, ça compte pour la suite.</p>
        ${rm ? `<div class="insight-box">Ton point de vigilance n°1 : <b>${rm.label}</b>. La prochaine fois, repère-le plus vite — c'est déjà un vrai progrès.</div>` : ''}
        <button class="btn" id="find-next">Trouver mon prochain projet</button>
      </div>
    `);
    root.appendChild(card);
    card.querySelector('#find-next').onclick = () => { state.pivotDraft = null; saveState(state); };
    return;
  }
}

// ---------- ROUTER ----------
function render() {
  if (!state.seenLanding) return renderLanding();
  if (state.pivotDraft) return renderPivotFlow();
  if (!state.onboarded) return state.onboardingStep === 2 ? renderOnboardingEngagement() : renderOnboardingJournal();
  if (!state.currentEngagement) return renderOnboardingEngagement();
  if (state.addingPast) return renderAddPastFromDashboard();
  return renderDashboard();
}
render();
</script>
</body>
</html>
